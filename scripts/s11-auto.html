<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>S11 자동화 — 업그레이드 중 ICE failure</title>
<style>
  body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 20px; }
  h2 { color: #f90; margin: 0 0 16px; }
  .section { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
  input[type=text], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    background: #333; border: 1px solid #555; border-radius: 4px;
    color: #eee; font-family: monospace; font-size: 13px; margin-bottom: 8px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button {
    padding: 8px 20px; border: none; border-radius: 4px;
    font-family: monospace; font-size: 13px; cursor: pointer; margin-right: 8px;
  }
  #btnStart { background: #0a0; color: #fff; }
  #btnStart:disabled { background: #555; cursor: default; }
  #btnStop { background: #a00; color: #fff; }
  #btnStop:disabled { background: #555; cursor: default; }
  #btnKill { background: #c40; color: #fff; }
  #btnKill:disabled { background: #555; cursor: default; }
  #btnClear { background: #444; color: #ccc; }
  #status { margin: 10px 0; font-size: 14px; }
  #status.running { color: #0f0; }
  #status.error { color: #f55; }
  #status.done { color: #0af; }
  #status.kill { color: #fa0; }
  #log {
    background: #111; border: 1px solid #333; border-radius: 4px;
    padding: 10px; height: 420px; overflow-y: auto;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap;
  }
  .log-info  { color: #ccc; }
  .log-ok    { color: #0d0; }
  .log-warn  { color: #fa0; }
  .log-error { color: #f44; }
  .log-cycle { color: #08f; font-weight: bold; }
  .log-phase { color: #fa0; }
  .log-kill  { color: #f08; font-weight: bold; }
  .log-senior { color: #6cf; }
  #deviceList { margin-top: 6px; font-size: 11px; color: #888; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<h2>S11 자동화 — 모니터링→통화 업그레이드 도중 ICE failure</h2>

<div class="section">
  <label>대상 기기 (Senior)</label>
  <select id="deviceSelect" onchange="onDeviceSelect()">
    <option value="">로딩 중...</option>
  </select>
  <div id="deviceList"></div>
</div>

<div class="section">
  <div class="row">
    <div>
      <label>"Wi-Fi off" 타이밍 (어느 phase 직후 kill)</label>
      <select id="killPhase">
        <option value="afterUpgradeReq">P2 직후 — upgradeRequest write 직후 (Bug #1-B 트리거 영역)</option>
        <option value="afterRenegOffer" selected>P4 직후 — renegotiateOffer write 직후 (S11 핵심)</option>
        <option value="afterRenegAnswer">P6 직후 — renegotiateAnswer 적용 후 (IN_CALL 진입 후 = S2 변형)</option>
        <option value="manual">manual — Kill 버튼으로 직접 트리거</option>
        <option value="none">kill 안 함 — 정상 경로 (회귀 검증)</option>
      </select>
    </div>
    <div>
      <label>kill 종류</label>
      <select id="killKind">
        <option value="both" selected>RTDB write 차단 + PC.close()</option>
        <option value="signaling">RTDB write 차단만 (PC 유지)</option>
        <option value="pc">PC.close() 만 (RTDB 유지)</option>
      </select>
    </div>
    <div>
      <label>kill 후 관찰 시간 (ms)</label>
      <input type="number" id="observeMs" value="20000" min="2000" max="120000">
      <div class="hint">Senior STOP_DELAY (5~7s) + ICE restart 한도(60s) 관찰</div>
    </div>
    <div>
      <label>반복 횟수</label>
      <input type="number" id="repeat" value="1" min="1" max="50">
    </div>
    <div>
      <label>사이클 간 대기 (ms)</label>
      <input type="number" id="betweenMs" value="3000" min="0" max="30000">
    </div>
    <div>
      <label>seniorAccepted 대기 timeout (ms)</label>
      <input type="number" id="acceptTimeoutMs" value="30000" min="3000" max="60000">
    </div>
  </div>
  <div class="hint">
    P0 monitor 생성 → P1 CONNECTED → P2 upgradeRequest='call' → P3 seniorAccepted → P4 renegotiateOffer → P5 (kill 가능) → P6 renegotiateAnswer → P7 (kill 가능) → P8 observe → P9 cleanup
  </div>
  <div style="margin-top:8px;">
    <button id="btnStart" onclick="startScenario()">▶ S11 시나리오 시작</button>
    <button id="btnKill" onclick="manualKill()" disabled>💀 Manual Kill</button>
    <button id="btnStop" onclick="stopScenario()" disabled>■ 중지</button>
    <button id="btnClear" onclick="clearLog()">로그 지우기</button>
  </div>
  <div id="status">대기 중</div>
</div>

<div class="section">
  <div id="log"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {
  getDatabase, ref, push, set, get, remove, onValue, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDOsFt5t45jpcJWVwaMxy6gjP7kCR01ERU",
  authDomain: "dcom-smart-frame.firebaseapp.com",
  databaseURL: "https://dcom-smart-frame-default-rtdb.firebaseio.com",
  projectId: "dcom-smart-frame",
  storageBucket: "dcom-smart-frame.firebasestorage.app",
  messagingSenderId: "632083959171",
  appId: "1:632083959171:web:138189f8fa7ef7bb8e7ab6"
};

const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:a.relay.metered.ca:80',
      username: 'e8dd65e92f6e86cfe1ef0635', credential: 'dktMDqpJIcMw4VYz' },
    { urls: 'turn:a.relay.metered.ca:443',
      username: 'e8dd65e92f6e86cfe1ef0635', credential: 'dktMDqpJIcMw4VYz' },
    { urls: 'turn:a.relay.metered.ca:443?transport=tcp',
      username: 'e8dd65e92f6e86cfe1ef0635', credential: 'dktMDqpJIcMw4VYz' }
  ]
};

const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);

let stopped = false;
let manualKillFired = false;
let targetDeviceId = '';
let familyId = '';
let activeCtx = null; // current cycle context for manual kill

// ────────────────── 기기 목록 로드 ──────────────────
onValue(ref(db, 'devices'), snap => {
  const sel = document.getElementById('deviceSelect');
  const info = document.getElementById('deviceList');
  sel.innerHTML = '<option value="">기기 선택...</option>';
  if (!snap.exists()) { sel.innerHTML = '<option value="">기기 없음</option>'; return; }
  const devices = [];
  snap.forEach(child => {
    const d = child.val();
    devices.push({ id: child.key, ...d });
  });
  devices.sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
  devices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id;
    const onlineIcon = d.online ? '🟢' : '⚫';
    opt.textContent = `${onlineIcon} ${d.id} | ${d.model || '?'} | familyId: ${d.familyId || '없음'}`;
    sel.appendChild(opt);
  });
  info.textContent = `총 ${devices.length}개 기기`;
});

window.onDeviceSelect = async function() {
  const sel = document.getElementById('deviceSelect');
  targetDeviceId = sel.value;
  if (!targetDeviceId) { familyId = ''; return; }
  const snap = await get(ref(db, `devices/${targetDeviceId}/familyId`));
  familyId = snap.val() || '';
  log(`기기 선택: ${targetDeviceId} | familyId: ${familyId}`, 'info');
};

// ────────────────── 메인 시나리오 ──────────────────
window.startScenario = async function() {
  if (!targetDeviceId) { alert('기기를 선택하세요'); return; }
  if (!familyId) { alert('familyId 를 찾을 수 없습니다'); return; }

  stopped = false;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled  = false;

  const repeat        = parseInt(document.getElementById('repeat').value);
  const betweenMs     = parseInt(document.getElementById('betweenMs').value);
  const acceptTimeout = parseInt(document.getElementById('acceptTimeoutMs').value);
  const observeMs     = parseInt(document.getElementById('observeMs').value);
  const killPhase     = document.getElementById('killPhase').value;
  const killKind      = document.getElementById('killKind').value;

  setStatus(`시나리오 진행 (0 / ${repeat}) — killPhase=${killPhase}`, 'running');
  log(`==== S11 시나리오 시작: ${repeat}회, killPhase=${killPhase}, killKind=${killKind}, observe=${observeMs}ms ====`, 'cycle');

  for (let i = 1; i <= repeat; i++) {
    if (stopped) { log('사용자 중지', 'warn'); break; }
    setStatus(`시나리오 진행 (${i} / ${repeat})`, 'running');
    await runScenario(i, { killPhase, killKind, observeMs, acceptTimeout });
    if (i < repeat && !stopped) {
      log(`사이클 간 대기 ${betweenMs}ms`, 'info');
      await sleep(betweenMs);
    }
  }

  if (!stopped) {
    setStatus('완료', 'done');
    log('==== S11 시나리오 완료 ====', 'cycle');
  }
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled  = true;
  document.getElementById('btnKill').disabled  = true;
};

window.stopScenario = function() {
  stopped = true;
  setStatus('중지 중...', 'warn');
};

window.manualKill = function() {
  if (!activeCtx) { alert('활성 사이클 없음'); return; }
  manualKillFired = true;
  log('▶ Manual Kill 트리거', 'kill');
};

async function runScenario(cycleNum, opts) {
  const t0 = Date.now();
  const phases = []; // { phase, ts }
  const seniorEvents = []; // { type, value, ts }
  const ctx = {
    pc: null,
    callId: null,
    killed: false,
    blockSignaling: false,
    unsubs: []
  };
  activeCtx = ctx;
  manualKillFired = false;

  const markPhase = (name) => {
    const dt = Date.now() - t0;
    phases.push({ phase: name, ts: dt });
    log(`  [P${name}] +${dt}ms`, 'phase');
  };

  const trySafeWrite = async (path, value) => {
    if (ctx.blockSignaling) {
      log(`  [BLOCKED] write skipped: ${path}`, 'warn');
      return false;
    }
    await set(ref(db, path), value);
    return true;
  };

  const fireKill = async (label) => {
    if (ctx.killed) return;
    ctx.killed = true;
    log(`▶ KILL (${label}) — kind=${opts.killKind}`, 'kill');
    if (opts.killKind === 'pc' || opts.killKind === 'both') {
      try { ctx.pc?.close(); log('  PC.close() 실행', 'kill'); } catch (_) {}
    }
    if (opts.killKind === 'signaling' || opts.killKind === 'both') {
      ctx.blockSignaling = true;
      log('  RTDB write 차단', 'kill');
    }
  };

  log(`--- CYCLE ${cycleNum} 시작 ---`, 'cycle');

  try {
    // ── P0: PC + transceivers ──
    const pc = new RTCPeerConnection(ICE_SERVERS);
    ctx.pc = pc;
    // monitor 시작은 recvonly 트랜시버
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      log(`  [pc] connectionState = ${s}`, s === 'connected' ? 'ok' : (s === 'failed' || s === 'disconnected' ? 'warn' : 'info'));
    };

    // ── P0a: offer 생성 ──
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    markPhase('0:offer 생성');

    // ── P0b: Firebase call 노드 생성 ──
    const callRef = push(ref(db, 'calls'));
    ctx.callId = callRef.key;
    await set(callRef, {
      offer: { sdp: offer.sdp, type: offer.type },
      targetDeviceId,
      callerName: 'S11Auto',
      familyId,
      callType: 'monitor',
      status: 'ringing',
      createdAt: serverTimestamp()
    });
    log(`  Firebase call 생성: ${ctx.callId}`, 'info');

    // ── ICE candidates → Firebase ──
    pc.onicecandidate = evt => {
      if (evt.candidate && ctx.callId && !ctx.blockSignaling) {
        push(ref(db, `calls/${ctx.callId}/callerCandidates`), {
          candidate: evt.candidate.candidate,
          sdpMid: evt.candidate.sdpMid,
          sdpMLineIndex: evt.candidate.sdpMLineIndex
        }).catch(() => {});
      }
    };

    // ── Senior callee candidates ──
    const calleeUnsub = onValue(ref(db, `calls/${ctx.callId}/calleeCandidates`), snap => {
      snap.forEach(child => {
        const c = child.val();
        if (c) pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      });
    });
    ctx.unsubs.push(calleeUnsub);

    // ── Senior status 추적 ──
    const statusUnsub = onValue(ref(db, `calls/${ctx.callId}/status`), snap => {
      const v = snap.val();
      if (v) {
        seniorEvents.push({ type: 'status', value: v, ts: Date.now() - t0 });
        log(`  [Senior] status = ${v}`, 'senior');
      }
    });
    ctx.unsubs.push(statusUnsub);

    // ── P1: CONNECTED 대기 ──
    const connected = await waitForAnswer(pc, ctx.callId, 8000);
    if (!connected) { log('  answer/connected 타임아웃', 'error'); return; }
    markPhase('1:CONNECTED (monitor)');

    if (opts.killPhase === 'afterUpgradeReq' && manualKillFired === false) {
      // 약간 안정화 기다림 (Senior 가 monitor 모드 안정화)
      await sleep(500);
    }

    // ── P2: upgradeRequest='call' write ──
    const writeOk = await trySafeWrite(`calls/${ctx.callId}/upgradeRequest`, 'call');
    if (writeOk) markPhase('2:upgradeRequest=call');
    else markPhase('2:upgradeRequest BLOCKED');

    if (opts.killPhase === 'afterUpgradeReq') {
      await fireKill('afterUpgradeReq');
      await observeAndCleanup(ctx, opts.observeMs);
      return;
    }

    // ── P3: seniorAccepted 대기 ──
    const acceptResult = await waitForSeniorAccepted(ctx, opts.acceptTimeout);
    if (!acceptResult.ok) {
      log(`  seniorAccepted 타임아웃 (${opts.acceptTimeout}ms)`, 'error');
      await observeAndCleanup(ctx, 2000);
      return;
    }
    markPhase('3:seniorAccepted');

    // ── P4: renegotiateOffer 전송 ──
    // 트랜시버 SendRecv 로 변경 — Family Flutter 와 동일 패턴
    const senders = pc.getTransceivers();
    senders.forEach(t => { try { t.direction = 'sendrecv'; } catch(_) {} });

    // getUserMedia (audio/video) — 양방향 전환
    let localStream = null;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 320, height: 240 } });
      const transceivers = pc.getTransceivers();
      const tracks = localStream.getTracks();
      transceivers.forEach((t, i) => {
        if (tracks[i] && t.sender) {
          t.sender.replaceTrack(tracks[i]).catch(() => {});
        }
      });
    } catch (e) {
      log(`  getUserMedia 실패 (계속 진행): ${e.message}`, 'warn');
    }

    const renegOffer = await pc.createOffer();
    await pc.setLocalDescription(renegOffer);
    const renegOk = await trySafeWrite(`calls/${ctx.callId}/renegotiateOffer`, {
      sdp: renegOffer.sdp, type: renegOffer.type
    });
    if (renegOk) markPhase('4:renegotiateOffer 전송');
    else markPhase('4:renegotiateOffer BLOCKED');

    if (opts.killPhase === 'afterRenegOffer') {
      await fireKill('afterRenegOffer');
      await observeAndCleanup(ctx, opts.observeMs, localStream);
      return;
    }

    // ── P5: manual kill 폴링 (timeout 짧게) ──
    if (opts.killPhase === 'manual') {
      log('  Manual kill 대기 — Manual Kill 버튼 누르세요', 'warn');
      document.getElementById('btnKill').disabled = false;
      const killStart = Date.now();
      while (Date.now() - killStart < opts.acceptTimeout && !manualKillFired && !stopped) {
        await sleep(100);
      }
      document.getElementById('btnKill').disabled = true;
      if (manualKillFired) {
        await fireKill('manual');
        await observeAndCleanup(ctx, opts.observeMs, localStream);
        return;
      }
    }

    // ── P6: renegotiateAnswer 대기 ──
    const renegRes = await waitForRenegotiateAnswer(pc, ctx.callId, 10000);
    if (!renegRes.ok) {
      log('  renegotiateAnswer 타임아웃', 'error');
      await observeAndCleanup(ctx, opts.observeMs, localStream);
      return;
    }
    if (renegRes.unsub) ctx.unsubs.push(renegRes.unsub);
    markPhase('6:renegotiateAnswer 적용 (IN_CALL)');

    if (opts.killPhase === 'afterRenegAnswer') {
      await fireKill('afterRenegAnswer');
      await observeAndCleanup(ctx, opts.observeMs, localStream);
      return;
    }

    // ── 정상 경로 — observe 시간만큼 IN_CALL 유지 후 cleanup ──
    log('  정상 경로 — IN_CALL 유지', 'ok');
    await sleep(Math.min(opts.observeMs, 5000));
    await cleanup(ctx, localStream);
    markPhase('9:cleanup');
  } catch (e) {
    log(`  CYCLE ${cycleNum} 예외: ${e.message}`, 'error');
    await cleanup(ctx);
  } finally {
    activeCtx = null;
    log(`--- CYCLE ${cycleNum} 종료 (총 ${Date.now() - t0}ms) ---`, 'cycle');
    log(`  Phase 요약: ${phases.map(p => `${p.phase}@${p.ts}ms`).join(' → ')}`, 'info');
    log(`  Senior status 변화: ${seniorEvents.map(e => `${e.value}@${e.ts}ms`).join(' → ')}`, 'senior');
  }
}

async function observeAndCleanup(ctx, observeMs, localStream) {
  log(`  observation window ${observeMs}ms — Senior 반응 관찰`, 'info');
  const observeStart = Date.now();
  while (Date.now() - observeStart < observeMs && !stopped) {
    await sleep(200);
  }
  await cleanup(ctx, localStream);
}

async function cleanup(ctx, localStream) {
  // RTDB 정리 — block 해제 (cleanup 은 항상 실행)
  ctx.blockSignaling = false;
  try {
    if (ctx.callId) {
      await set(ref(db, `calls/${ctx.callId}/status`), 'ended').catch(() => {});
      setTimeout(() => remove(ref(db, `calls/${ctx.callId}`)).catch(() => {}), 2000);
    }
  } catch (_) {}
  ctx.unsubs.forEach(u => { try { u(); } catch(_) {} });
  try { ctx.pc?.close(); } catch (_) {}
  if (localStream) localStream.getTracks().forEach(t => t.stop());
}

// ────────────────── 헬퍼 ──────────────────
function waitForAnswer(pc, callId, timeoutMs) {
  return new Promise(resolve => {
    let settled = false;
    const timer = setTimeout(() => { if (!settled) { settled = true; resolve(false); } }, timeoutMs);

    onValue(ref(db, `calls/${callId}/answer`), async snap => {
      if (settled || !snap.exists()) return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
      } catch (_) {}
    });

    pc.onconnectionstatechange = () => {
      if (settled) return;
      const s = pc.connectionState;
      if (s === 'connected') {
        settled = true; clearTimeout(timer); resolve(true);
      } else if (s === 'failed') {
        settled = true; clearTimeout(timer); resolve(false);
      }
    };
  });
}

function waitForSeniorAccepted(ctx, timeoutMs) {
  return new Promise(resolve => {
    let settled = false;
    let unsub = null;
    const timer = setTimeout(() => {
      if (!settled) { settled = true; unsub?.(); resolve({ ok: false }); }
    }, timeoutMs);
    unsub = onValue(ref(db, `calls/${ctx.callId}/seniorAccepted`), snap => {
      if (settled) return;
      if (snap.val() === true) {
        settled = true; clearTimeout(timer);
        ctx.unsubs.push(unsub);
        resolve({ ok: true });
      }
    });
  });
}

function waitForRenegotiateAnswer(pc, callId, timeoutMs) {
  return new Promise(resolve => {
    let settled = false;
    let unsub = null;
    const timer = setTimeout(() => {
      if (!settled) { settled = true; unsub?.(); resolve({ ok: false }); }
    }, timeoutMs);
    unsub = onValue(ref(db, `calls/${callId}/renegotiateAnswer`), async snap => {
      if (settled || !snap.exists()) return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
        settled = true; clearTimeout(timer); resolve({ ok: true, unsub });
      } catch (_) { /* 계속 대기 */ }
    });
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const ts = new Date().toTimeString().slice(0, 8);
  const line = document.createElement('span');
  line.className = `log-${type}`;
  line.textContent = `[${ts}] ${msg}\n`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  console.log(`[${ts}] ${msg}`);
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

window.clearLog = function() { document.getElementById('log').innerHTML = ''; };
</script>
</body>
</html>
